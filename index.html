<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Furniture Viewer</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>

<body style="margin: 0;">

    <a-scene
        embedded
        style="width: 100%; height: 100vh;"
        background="color: #E8E8E8">

        <!-- Ground -->
        <a-plane
            rotation="-90 0 0"
            width="20"
            height="20"
            color="#D9D2C7">
        </a-plane>

        <!-- Furniture -->
        <a-entity
            gltf-model="url(office_chair.glb)"
            position="0 0 0"
            scale="1 1 1">
        </a-entity>

        <!-- Camera -->
        <a-entity
            camera
            position="0 1.6 4"
            look-controls>
        </a-entity>

        <!-- Lighting -->
        <a-light
            type="ambient"
            intensity="1">
        </a-light>

        <a-light
            type="directional"
            position="2 4 3"
            intensity="1">
        </a-light>

    </a-scene>

</body>
</html>
